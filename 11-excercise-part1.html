<!DOCTYPE html>
<html>
  <head>

  </head>
  <body>
    <script>
      const nums=[10,20,30];
      nums[2]=99;
      console.log(nums);

      function getLastValue(array){
        const lastIndex=array.length-1;
        console.log(array[lastIndex]);
      }
      const array=[1,20,22,24,25];
      
      getLastValue(array);

      function arraySwap(array){
        const temp=array[(array.length)-1];
        array[(array.length)-1]=array[0];
        array[0]=temp;
        console.log(array);
      }
      arraySwap(array);

      for(let i=0;i<=10;i+=2){
        console.log(i);
      }

      for(let i=5;i>=0;i--){
        console.log(i);
      }
      i=0;
      while(i<=10){
        console.log(i);
        i+=2;
      }
      i=10;
      while(i>=0){
        console.log(i);
        i-=1;
      }
    </script>
  </body>
</html>
