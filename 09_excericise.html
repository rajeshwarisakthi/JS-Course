<!DOCTYPE html>
<html>
  <head>
    <title>09-excercise</title>
  </head>

  <body>
    <button>9a</button>
    <button class="js-button">9b</button>

    <button onclick="
    document.querySelector('.js-choice').innerHTML='you chose: heads';
    ">heads</button>

    <button onclick="
    document.querySelector('.js-choice').innerHTML='You chose: tails';
    ">tails</button>
    <p class="js-choice"></p>

    <input placeholder="Name" class="js-name-input" onkeydown="
    if (event.key==='Enter'){
    displayMessage();
    }
    ">

    <button onclick="const inputElement=document.querySelector('.js-name-input');
    document.querySelector('.js-message').innerHTML=`Your name is : ${inputElement.value}`;
    displayMessage();
    ">Submit</button>

    <p class="js-message"></p>

    <p>Amazon SHipping Calculator</p>
    <input placeholder="Cost of Order" class="js-cost-input" onkeydown="handleCostKeydown(event);">

    <button onclick="
    calculateTotal();
    ">Calculate</button>

    <p class="js-total-cost"></p>

    <input placeholder="Type something" class="js-input" onkeyup="
    const inputelement=document.querySelector('.js-input');
    document.querySelector('.js-messages').innerHTML=inputelement.value;
    ">

    <p class="js-messages"></p>
    <script>
      console.log(document.querySelector('button'));
      document.querySelector('.js-button').innerHTML='9b done!';

      function displayMessage(){
        const inputElement=document.querySelector('.js-name-input');
        document.querySelector('.js-message').innerHTML=`Youe name is : ${inputElement.value}`
          }

          function handleCostKeydown(event){
            if(event.key==='Enter'){
              calculateTotal();
            }
          }

          function calculateTotal(){
            const inputElement=document.querySelector('.js-cost-input');

            let cost =Number(inputElement.value)*100;

            if(cost<4000){
              cost=cost+1000;
            }

            document.querySelector('.js-total-cost').innerHTML=`$${cost/100}`;
          }
    </script>
  </body>
</html>
