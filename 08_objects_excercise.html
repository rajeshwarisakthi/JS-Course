<!DOCTYPE html>
<html>
  <head>
    <title>Objects Excercise</title>
  </head>
  <body>
     <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
        // Note: eval() takes a string and runs it as code.
        // Avoid using eval() in real world projects since
        // it can potentially be given harmful code to run.
        // Only use eval() for learning purposes.
        calculation = eval(calculation);
        console.log(calculation);

        // Remember to save the calculation here.
        localStorage.setItem('calculation', calculation);
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        console.log(calculation);

        // Remember to save the calculation here.
        localStorage.setItem('calculation', calculation);
      ">Clear</button>
    </p>

    <button onclick="
    playGame('heads');
    ">
      heads
    </button>

    <button onclick="
    playGame('tails');
    ">tails</button>
    
    <script>
      function comparePrice(product,product2){
        if(product.price<product2.price){
          return product;
        }
        else{
          return product2;
        }
      }

      function isSameProduct(product,product2){
        if(product.price==product2.price){
          return true;
        }
        else{
          return false;
        }
      }
      const product={
        name:'Basket Ball',
        price:2095
      };
      const product2={
        name:'socks',
        price:2395
      };
      
      product.price+=300;
      product['delivery time']='3 days'
      console.log(product);
      console.log(comparePrice(product,product2));

      console.log(isSameProduct(product,product2));

      console.log('GOOD Morning'.toLowerCase());
      console.log('TesTing'.toLowerCase());

      console.log('Test'.repeat(2));
      console.log('Checking'.repeat(5));

      let calculation = localStorage.getItem('calculation') || '';

      function updateCalculation(value) {
        calculation += value;
        console.log(calculation);
        localStorage.setItem('calculation', calculation);
      }

      
      function saveCalculation() {
        localStorage.setItem('calculation', calculation);
      }


      let score=JSON.parse(localStorage.getItem('score')) || {
        wins:0,
        lose:0
      };
      function playGame(guess){
        const randomNumber=Math.random();
        const result=randomNumber<0.5 ? 'heads': 'tails';

        console.log(guess===result? 'You Win': 'You Lose');
      

      if(guess === result){
        score.wins++;
      }
      else{
        score.lose++;
      }

      console.log(score);
      localStorage.setItem('score',JSON.stringify(score));
    }

    </script>
  </body>
</html>
